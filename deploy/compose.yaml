# Demo LOCAL del patron Sidecar: agente + LiteLLM.
#
# Sidecar REAL en compose: litellm comparte el namespace de red del contenedor
# del agente (network_mode: service:app), por lo que el agente lo ve en
# 127.0.0.1:4000 y NADIE mas en la red/host. Es el mismo comportamiento de
# dos containers en un Pod de Kubernetes. Nada mas fuerzas los puertos: el
# sidecar no se expone al host.
#
#   docker compose -f deploy/compose.yaml up --build
#   curl http://127.0.0.1:2024/health                  # agente sano
#   curl -X POST http://127.0.0.1:2024/a2a/conversational \
#        -H "Content-Type: application/json" \
#        -H "A2A-Version: 1.0" \
#        -d '{"jsonrpc":"2.0","id":1,"method":"SendMessage","params":{"message":{"role":"user","parts":[{"kind":"text","text":"hola"}]}}}'
# Las API keys reales se pasan por env al sidecar (nunca al agente).
services:
  app:
    build:
      context: ..
      dockerfile: src/Dockerfile
    container_name: agent-quality-gateway
    environment:
      CHAT_PROVIDER: openai
      OPENAI_MODEL: gpt-fleet-default
      OPENAI_BASE_URL: http://127.0.0.1:4000/v1   # loopback del POD: el sidecar
      OPENAI_API_KEY: sk-litellm-local            # dummy: routing lo hace el sidecar
      HOST: 0.0.0.0
      PORT: "2024"
    ports:
      - "2024:2024"

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: agent-quality-litellm
    command: ["--config", "/etc/litellm/config.yaml", "--port", "4000"]
    environment:
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      - ./litellm-config.yaml:/etc/litellm/config.yaml:ro
    # Sidecar: comparte la red del agente => visible solo en 127.0.0.1:4000.
    network_mode: "service:app"
    depends_on:
      app:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s